---
layout: default
title: Lau Persijn
path: home
---

    <div x-data="{
    active: 0,
    total: {{ collections.films | length }},
    timer: null,
    start() {
      this.timer = setInterval(() => {
        if (this.total > 0) {
          this.active = (this.active + 1) % this.total;
        }
      }, 5000);
    },
    stop() {
      clearInterval(this.timer);
    }
  }" x-init="start()"
        class="flex h-[calc(100svh-8rem)] w-full items-center justify-center mt-4">
        <div class="relative aspect-[4/3] w-full max-w-[min(100%,calc((100svh-8rem)*4/3))] overflow-hidden">
        {% for item in collections.films %}
        {% if item.data.galleryImages and item.data.galleryImages[0] %}
        <a href="{{ item.url }}" x-show="active === {{ loop.index0 }}"
            x-transition:enter="transition-opacity ease-in-out duration-1000" x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100" x-transition:leave="transition-opacity ease-in-out duration-1000"
            x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
            class="absolute inset-0 block transition-opacity duration-1000 ease-in-out">
            <img src="{{ item.data.galleryImages[0].image }}"
                alt="{{ item.data.galleryImages[0].alt | default('Film Image') }}"
                class="h-full w-full object-contain" />
        </a>
        {% endif %}
        {% endfor %}
        </div>
    </div>
