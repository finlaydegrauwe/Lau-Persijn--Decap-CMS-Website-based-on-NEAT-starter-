<div class="w-full text-xl">
    <nav class="flex flex-col lg:flex-row items-center justify-center lg:justify-between flex-wrap ">
        <!--Logo etc-->
        <div class="flex grow items-center">
            <a href="/">
                {{settings.name}}</a>
        </div>

        <!--Menu-->
        <div class="lg:flex lg:items-center lg:w-auto text-center ">

            {% if navigation.items %}

            <ul class="flex flex-row lg:pt-0 list-reset lg:flex justify-end flex-1 items-center flex-wrap gap-3">
                {% for item in navigation.items %}
                <li class="nav__item grow">
                    {% if item.children %}
                    <details class="relative flex flex-col lg:flex-row-reverse">
                        <ul class="flex lg:flex-row">
                            {% for child in item.children %}
                            <li class="flex-grow">
                                <a class="text-ml inline-block no-underline lowercase text-gray-600 mx-3"
                                    href="{{ child.url }}"
                                    {% if child.target == "_blank" %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ child.text }}</a>
                            </li>
                            {% endfor %}
                        </ul>
                        <summary class="text-ml inline-block no-underline lowercase cursor-pointer">{{ item.text }}</summary>
                    </details>
                    {% else %}
                    <a class="text-ml inline-block no-underline lowercase"
                        href="{{ item.url }}"
                        {% if item.target == "_blank" %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.text }}</a>
                    {% endif %}
                </li>
                {% endfor %}
            </ul>

            {% endif %}
        </div>
    </nav>
</div>
